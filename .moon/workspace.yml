# Moon Workspace Configuration
# Monorepo orchestration for Family Dashboard

$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Project discovery
projects:
  - 'backend'
  - 'frontend'
  - 'packages/*'

# Node.js version management
node:
  version: '20.11.0'
  packageManager: 'npm'
  npm:
    version: '10.2.4'

# Docker integration
docker:
  scaffold:
    include:
      - 'backend/**'
      - 'frontend/**'

# Task runner configuration
runner:
  archivableTargets:
    - 'build'
  cacheLifetime: '7 days'
  inheritColorsForPipedTasks: true
